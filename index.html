<head>
    <script>
        var earlyErrors = [];
        window.onerror = function(message, source, lineno, colno, error) {
            earlyErrors.push('Global Error: ' + message + '\n' + (error ? error.stack : ''));
        };
        window.onunhandledrejection = function(event) {
            earlyErrors.push('Unhandled Promise: ' + event.reason);
        };
        var oldErr = console.error;
        console.error = function() {
            earlyErrors.push('Console Error: ' + Array.from(arguments).map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
            oldErr.apply(console, arguments);
        };
        document.addEventListener("DOMContentLoaded", function() {
            var el = document.getElementById('error-display');
            if (el && earlyErrors.length > 0) {
                el.style.display = 'block';
                el.innerText += earlyErrors.join('\n\n') + '\n\n';
            }
        });
    </script>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { background-color: #1a202c; touch-action: none; }
        #root { width: 100%; height: 100%; }
        canvas { display: block; }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }

        .select-none { -webkit-user-select: none; user-select: none; }
        @keyframes fadeInOut {
            0%   { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
            78%  { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        .no-pauses-toast {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            pointer-events: none;
            animation: fadeInOut 2.5s ease forwards;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            color: #ffffff;
            background: rgba(15, 20, 30, 0.88);
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-bottom: 4px solid rgba(255, 255, 255, 0.1);
            padding: 12px 22px;
            border-radius: 10px;
            white-space: nowrap;
            letter-spacing: 0.12em;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
    </style>

            logError('Console Error: ' + Array.from(arguments).map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
