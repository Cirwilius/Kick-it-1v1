    <style>
        body { margin: 0; overflow: hidden; background-color: #1a202c; touch-action: none; }
        canvas { display: block; }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }

        .select-none { -webkit-user-select: none; user-select: none; }
        @keyframes fadeInOut {
            0%   { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
            78%  { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        .no-pauses-toast {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            pointer-events: none;
            animation: fadeInOut 2.5s ease forwards;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            color: #ffffff;
            background: rgba(15, 20, 30, 0.88);
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-bottom: 4px solid rgba(255, 255, 255, 0.1);
            padding: 12px 22px;
            border-radius: 10px;
            white-space: nowrap;
            letter-spacing: 0.12em;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
    </style>

    <div id="error-display" style="color: white; padding: 20px; font-family: monospace; z-index: 9999; position: absolute; background: red; display: none;"></div>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            var el = document.getElementById('error-display');
            if (el) {
                el.style.display = 'block';
                el.innerText = 'Global Error: ' + message + '\n' + (error ? error.stack : '');
            }
        };
        window.onunhandledrejection = function(event) {
            var el = document.getElementById('error-display');
            if (el) {
                el.style.display = 'block';
                el.innerText += '\nUnhandled Promise: ' + event.reason;
            }
        };
    </script>

        const distance = (v1, v2) => {
            const dx = v1.x - v2.x;
            const dy = v1.y - v2.y;
            return Math.sqrt(dx * dx + dy * dy);
        };

        const dot = (v1, v2) => v1.x * v2.x + v1.y * v2.y;

        const closestPointOnSegment = (p, a, b) => {
            const ab = { x: b.x - a.x, y: b.y - a.y };
            const t = ((p.x - a.x) * ab.x + (p.y - a.y) * ab.y) / (ab.x * ab.x + ab.y * ab.y);
            const clampedT = Math.max(0, Math.min(1, t));
            return { x: a.x + ab.x * clampedT, y: a.y + ab.y * clampedT };
        };

        const resolveStaticCapsuleCollision = (entity, start, end, radius) => {
            const closest = closestPointOnSegment(entity.pos, start, end);
            const distVec = { x: entity.pos.x - closest.x, y: entity.pos.y - closest.y };
            const dist = Math.sqrt(distVec.x * distVec.x + distVec.y * distVec.y);
            const minDist = entity.radius + radius;

            if (dist < minDist && dist > 0) {
                const normal = { x: distVec.x / dist, y: distVec.y / dist };
                const overlap = minDist - dist;
                entity.pos.x += normal.x * overlap;
                entity.pos.y += normal.y * overlap;

                const velocityAlongNormal = dot(entity.vel, normal);
                if (velocityAlongNormal < 0) {
                    const restitution = entity.restitution * 0.8;
                    const j = -(1 + restitution) * velocityAlongNormal;
                    entity.vel.x += j * normal.x;
                    entity.vel.y += j * normal.y;
                    return true;
                }
            }
            return false;
        };

        const resolveCircleCollision = (e1, e2) => {
            const dist = distance(e1.pos, e2.pos);
            const minDist = e1.radius + e2.radius;

            if (dist < minDist) {
                const normal = {
                    x: (e2.pos.x - e1.pos.x) / dist,
                    y: (e2.pos.y - e1.pos.y) / dist
                };

                const overlap = minDist - dist;
                const correctionRatio = 0.5;
                e1.pos.x -= normal.x * overlap * correctionRatio;
                e1.pos.y -= normal.y * overlap * correctionRatio;
                e2.pos.x += normal.x * overlap * correctionRatio;
                e2.pos.y += normal.y * overlap * correctionRatio;

                const relativeVelocity = {
                    x: e2.vel.x - e1.vel.x,
                    y: e2.vel.y - e1.vel.y
                };

                const velocityAlongNormal = dot(relativeVelocity, normal);
                if (velocityAlongNormal > 0) return;

                const restitution = Math.min(e1.restitution, e2.restitution);
                let impulseScalar = -(1 + restitution) * velocityAlongNormal;
                impulseScalar /= (1 / e1.mass + 1 / e2.mass);
                impulseScalar *= 1.15;

                const impulse = {
                    x: impulseScalar * normal.x,
                    y: impulseScalar * normal.y
                };

                e1.vel.x -= (1 / e1.mass) * impulse.x;
                e1.vel.y -= (1 / e1.mass) * impulse.y;
                e2.vel.x += (1 / e2.mass) * impulse.x;
                e2.vel.y += (1 / e2.mass) * impulse.y;
            }
        };

        class AudioService {
            constructor() {
                this.ctx = null;
                this.enabled = false;
                const savedVol = getStorageItem('kickItVolume');
                const parsed = parseInt(savedVol);
                this.masterVolume = (!isNaN(parsed)) ? parsed / 100 : 0.5;
            }

            init() {
                if (!this.ctx) {
                    try {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) {
                            this.ctx = new AudioCtx();
                            this.enabled = true;
                        }
                    } catch (e) {
                        console.warn("AudioContext init failed", e);
                        this.enabled = false;
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
            }

            setVolume(val) {
                this.masterVolume = Math.max(0, Math.min(1, val));
            }

            play(type) {
                if (!this.ctx || this.ctx.state === 'suspended') {
                    this.init();
                }
                if (!this.enabled || !this.ctx || this.masterVolume <= 0) return;

                switch (type) {
                    case 'JUMP': this.playTone(150, 'sine', 0.1, -50); break;
                    case 'KICK': this.playTone(100, 'square', 0.1, -50); this.playNoise(0.05); break;
                    case 'WALL': this.playTone(800, 'triangle', 0.05, -100); break;
                    case 'GOAL': this.playGoalSound(); break;
                    case 'WIN': this.playWinSound(); break;
                    case 'UI_SELECT': this.playTone(880, 'sine', 0.05, 0); break;
                    case 'TYPE': this.playTone(600, 'square', 0.03, 0); break;
                    case 'INTRO_END': this.playTone(300, 'sawtooth', 0.4, -200); break;
                }
            }

            playTone(freq, type, duration, slide = 0) {
                if (!this.ctx) return;
                const peakGain = 0.1 * this.masterVolume;
                if (peakGain <= 0.0001) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                if (slide !== 0) osc.frequency.linearRampToValueAtTime(Math.max(10, freq + slide), this.ctx.currentTime + duration);
                gain.gain.setValueAtTime(peakGain, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, peakGain * 0.1), this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            playNoise(duration) {
                if (!this.ctx) return;
                const peakGain = 0.1 * this.masterVolume;
                if (peakGain <= 0.0001) return;
                const bufferSize = this.ctx.sampleRate * duration;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(peakGain, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                noise.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }

            playGoalSound() {
                if (!this.ctx) return;
                const peakGain = 0.1 * this.masterVolume;
                const now = this.ctx.currentTime;
                [440, 554, 659, 880].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.1);
                    gain.gain.setValueAtTime(peakGain, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, peakGain * 0.1), now + i * 0.1 + 0.5);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 0.5);
                });
            }

            playWinSound() {
                if (!this.ctx) return;
                const peakGain = 0.1 * this.masterVolume;
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, now + i * 0.15);
                    gain.gain.setValueAtTime(peakGain, now + i * 0.15);
                    gain.gain.linearRampToValueAtTime(0.0001, now + i * 0.15 + 0.8);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.15);
                    osc.stop(now + i * 0.15 + 0.8);
                });
            }
        }

        const audioService = new AudioService();

        class GameEngine {
            constructor() {
                this.defaultState = this.createInitialState();
                this.state = JSON.parse(JSON.stringify(this.defaultState));
                this.difficulty = 'MEDIUM';
            }

            setDifficulty(d) {
                this.difficulty = d;
            }

            createInitialState() {
                return {
                    isPlaying: false,
                    isGoal: false,
                    winner: null,
                    score: { p1: 0, p2: 0 },
                    lastScorer: 0,
                    timeLeft: GAME_DURATION,
                    player1: {
                        id: 1,
                        pos: { x: GAME_WIDTH * 0.25, y: GROUND_Y - PLAYER_RADIUS },
                        vel: { x: 0, y: 0 },
                        radius: PLAYER_RADIUS,
                        mass: PLAYER_MASS,
                        restitution: 0.5,
                        color: COLORS.p1,
                        isGrounded: false,
                        score: 0,
                        speed: PLAYER_SPEED,
                        jumpForce: PLAYER_JUMP
                    },
                    player2: {
                        id: 2,
                        pos: { x: GAME_WIDTH * 0.75, y: GROUND_Y - PLAYER_RADIUS },
                        vel: { x: 0, y: 0 },
                        radius: PLAYER_RADIUS,
                        mass: PLAYER_MASS,
                        restitution: 0.5,
                        color: COLORS.p2,
                        isGrounded: false,
                        score: 0,
                        speed: PLAYER_SPEED,
                        jumpForce: PLAYER_JUMP
                    },
                    player3: {
                        id: 3,
                        pos: { x: GAME_WIDTH * 0.15, y: GROUND_Y - PLAYER_RADIUS },
                        vel: { x: 0, y: 0 },
                        radius: PLAYER_RADIUS,
                        mass: PLAYER_MASS,
                        restitution: 0.5,
                        color: '#60a5fa', // lighter blue
                        isGrounded: false,
                        score: 0,
                        speed: PLAYER_SPEED,
                        jumpForce: PLAYER_JUMP
                    },
                    player4: {
                        id: 4,
                        pos: { x: GAME_WIDTH * 0.85, y: GROUND_Y - PLAYER_RADIUS },
                        vel: { x: 0, y: 0 },
                        radius: PLAYER_RADIUS,
                        mass: PLAYER_MASS,
                        restitution: 0.5,
                        color: '#f87171', // lighter red
                        isGrounded: false,
                        score: 0,
                        speed: PLAYER_SPEED,
                        jumpForce: PLAYER_JUMP
                    },
                    is2v2: false,
                    ball: {
                        pos: { x: GAME_WIDTH / 2, y: -100 },
                        vel: { x: 0, y: 0 },
                        radius: BALL_RADIUS,
                        mass: BALL_MASS,
                        restitution: BALL_ELASTICITY,
                        color: COLORS.ball
                    },
                    kickoffFrames: 60
                };
            }

            resetPositions() {
                this.state.player1.pos = { x: GAME_WIDTH * 0.25, y: GROUND_Y - PLAYER_RADIUS };
                this.state.player1.vel = { x: 0, y: 0 };
                
                if (this.state.p2IsTeammate) {
                    this.state.player2.pos = { x: GAME_WIDTH * 0.15, y: GROUND_Y - PLAYER_RADIUS };
                    this.state.player3.pos = { x: GAME_WIDTH * 0.75, y: GROUND_Y - PLAYER_RADIUS };
                } else {
                    this.state.player2.pos = { x: GAME_WIDTH * 0.75, y: GROUND_Y - PLAYER_RADIUS };
                    this.state.player3.pos = { x: GAME_WIDTH * 0.15, y: GROUND_Y - PLAYER_RADIUS };
                }
                
                this.state.player2.vel = { x: 0, y: 0 };
                this.state.player3.vel = { x: 0, y: 0 };
                this.state.player4.pos = { x: GAME_WIDTH * 0.85, y: GROUND_Y - PLAYER_RADIUS };
                this.state.player4.vel = { x: 0, y: 0 };
                this.state.ball.pos = { x: GAME_WIDTH / 2, y: -100 };
                this.state.ball.vel = { x: 0, y: 0 };
                this.state.isGoal = false;
                this.state.lastScorer = 0;
                this.state.kickoffFrames = 60;
            }

            update(input, isTwoPlayerMode, onSound) {
                if (this.state.isGoal || this.state.winner) return;

                if (this.state.kickoffFrames > 0) this.state.kickoffFrames--;

                if (this.difficulty !== 'TRAINING') {
                    this.state.timeLeft -= 1 / 60;
                    if (this.state.timeLeft < 0) this.state.timeLeft = 0;
                }

                this.updatePlayer(this.state.player1, input.p1, onSound);
                
                if (this.difficulty === 'TRAINING') {
                    // In training mode, move player 2, 3, and 4 out of bounds to avoid interference
                    this.state.player2.pos.y = GAME_HEIGHT * 2;
                    this.state.player3.pos.y = GAME_HEIGHT * 2;
                    this.state.player4.pos.y = GAME_HEIGHT * 2;
                } else {
                    if (isTwoPlayerMode) {
                        this.updatePlayer(this.state.player2, input.p2, onSound);
                    } else {
                        this.updateAI(this.state.player2, this.state.player1, this.state.ball, onSound);
                    }
                    
                    if (this.state.is2v2) {
                        if (input.p3) {
                            this.updatePlayer(this.state.player3, input.p3, onSound);
                        } else {
                            if (this.state.p2IsTeammate) {
                                this.updateAI(this.state.player3, this.state.player1, this.state.ball, onSound, true);
                            } else {
                                this.updateAI(this.state.player3, this.state.player2, this.state.ball, onSound, false);
                            }
                        }
                        if (input.p4) {
                            this.updatePlayer(this.state.player4, input.p4, onSound);
                        } else {
                            if (this.state.p2IsTeammate) {
                                this.updateAI(this.state.player4, this.state.player2, this.state.ball, onSound, true);
                            } else {
                                this.updateAI(this.state.player4, this.state.player1, this.state.ball, onSound, true);
                            }
                        }
                    }
                }
                
                this.updateBall(this.state.ball, onSound);

                const v1Before = { ...this.state.player1.vel };
                const bBefore = { ...this.state.ball.vel };

                resolveCircleCollision(this.state.player1, this.state.ball);
                resolveCircleCollision(this.state.player2, this.state.ball);
                if (this.state.is2v2) {
                    resolveCircleCollision(this.state.player3, this.state.ball);
                    resolveCircleCollision(this.state.player4, this.state.ball);
                }
                
                const kickThreshold = 1;
                if (Math.abs(this.state.ball.vel.x - bBefore.x) > kickThreshold || Math.abs(this.state.ball.vel.y - bBefore.y) > kickThreshold) {
                    onSound('KICK');
                    this.state.lastTouchTime = this.state.timeLeft;
                    if (distance(this.state.player1.pos, this.state.ball.pos) < this.state.player1.radius + this.state.ball.radius + 10) {
                        this.state.lastTouchedBy = 1;
                    } else if (distance(this.state.player2.pos, this.state.ball.pos) < this.state.player2.radius + this.state.ball.radius + 10) {
                        this.state.lastTouchedBy = 2;
                    } else if (this.state.is2v2 && distance(this.state.player3.pos, this.state.ball.pos) < this.state.player3.radius + this.state.ball.radius + 10) {
                        this.state.lastTouchedBy = 3;
                    } else if (this.state.is2v2 && distance(this.state.player4.pos, this.state.ball.pos) < this.state.player4.radius + this.state.ball.radius + 10) {
                        this.state.lastTouchedBy = 4;
                    }
                    if (this.state.ball.pos.y < GAME_HEIGHT - this.state.ball.radius - 80 && GAME_DURATION - this.state.timeLeft < 10) {
                        if (this.state.lastTouchedBy === 1 && !this.state.acrobatEventFired) {
                            onSound('EV_ACROBAT');
                            this.state.acrobatEventFired = true;
                        }
                    }
                }
                
                if (Math.abs(this.state.ball.vel.x) < 0.5 && Math.abs(this.state.ball.vel.y) < 0.5 && this.state.ball.pos.y > GROUND_Y - this.state.ball.radius - 5) {
                    if (this.state.lastTouchTime && this.state.lastTouchTime - this.state.timeLeft > 10) {
                        if (!this.state.peacemakerEventFired) {
                            onSound('EV_PEACEMAKER');
                            this.state.peacemakerEventFired = true;
                        }
                    }
                }

                resolveCircleCollision(this.state.player1, this.state.player2);
                if (this.state.is2v2) {
                    resolveCircleCollision(this.state.player1, this.state.player3);
                    resolveCircleCollision(this.state.player1, this.state.player4);
                    resolveCircleCollision(this.state.player2, this.state.player3);
                    resolveCircleCollision(this.state.player2, this.state.player4);
                    resolveCircleCollision(this.state.player3, this.state.player4);
                }

                // Anti-stuck logic for when ball gets caught between players
                const dist1 = distance(this.state.player1.pos, this.state.ball.pos);
                const dist2 = distance(this.state.player2.pos, this.state.ball.pos);
                const collisionDist = this.state.player1.radius + this.state.ball.radius + 10;
                
                if (dist1 < collisionDist && dist2 < collisionDist) {
                    if (Math.abs(this.state.ball.vel.x) < 5 && Math.abs(this.state.ball.vel.y) < 5) {
                        // Pop the ball upwards
                        this.state.ball.vel.y -= 8;
                        // Give it a tiny bit of horizontal randomness to break the tie
                        this.state.ball.vel.x += (Math.random() - 0.5) * 6;
                    }
                }

                this.checkGoal(onSound);
            }

            updatePlayer(p, input, onSound) {
                if (input.left) p.vel.x -= p.speed;
                if (input.right) p.vel.x += p.speed;
                if (input.jump && p.isGrounded) {
                    p.vel.y = -p.jumpForce;
                    p.isGrounded = false;
                    onSound('JUMP');
                }
                this.applyPhysics(p);
                this.constrainPlayer(p);
            }

            updateAI(ai, opponent, ball, onSound, isRightTeam = true) {
                let speedMult = 1;
                let aggression = 0; 
                let jumpSensitivity = 1; 
                let lookAheadFrames = 12; 
                let deadzone = 12; 
                let defenseCushion = 120; 

                if (this.difficulty === 'EASY') {
                    speedMult = 0.6; aggression = -60; jumpSensitivity = 0.3; lookAheadFrames = 0; deadzone = 60; defenseCushion = 180;
                } else if (this.difficulty === 'MEDIUM') {
                    speedMult = 0.85; aggression = -20; jumpSensitivity = 0.65; lookAheadFrames = 6; deadzone = 40; defenseCushion = 150;
                } else if (this.difficulty === 'HARD') {
                    speedMult = 1.05; aggression = 0; jumpSensitivity = 1.0; lookAheadFrames = 12; deadzone = 20; defenseCushion = 120;
                } else if (this.difficulty === 'INSANE') {
                    speedMult = 1.35; aggression = 45; jumpSensitivity = 1.3; lookAheadFrames = 20; deadzone = 5; defenseCushion = 70;
                }
                
                // If the opponent is a teammate (when passed teammate as opponent?), wait, in 2v2 the "opponent" passed is usually just the ball's nearest.
                // We'll just define basic direction logic depending on side.

                ai.speed = PLAYER_SPEED * speedMult;

                const isBallLeftOfAI = ball.pos.x < ai.pos.x;
                const ballMovingToOwnGoal = isRightTeam ? ball.vel.x > 1 : ball.vel.x < -1;
                const opponentHasPossession = distance(opponent.pos, ball.pos) < 140; // opponent is just one player out of many, but good enough

                let targetX = isRightTeam ? (ball.pos.x + 40 - aggression) : (ball.pos.x - 40 + aggression);

                if (this.state.kickoffFrames > 0) {
                    targetX = ball.pos.x;
                } else if (isRightTeam && ball.pos.x < GAME_WIDTH * 0.6 && (opponentHasPossession || ballMovingToOwnGoal)) {
                   targetX = ball.pos.x + defenseCushion + (ball.vel.x * 15);
                } else if (!isRightTeam && ball.pos.x > GAME_WIDTH * 0.4 && (opponentHasPossession || ballMovingToOwnGoal)) {
                   targetX = ball.pos.x - defenseCushion + (ball.vel.x * 15);
                } else if (ballMovingToOwnGoal && isRightTeam && ball.pos.x > GAME_WIDTH * 0.6) {
                   targetX = ball.pos.x + 25;
                } else if (ballMovingToOwnGoal && !isRightTeam && ball.pos.x < GAME_WIDTH * 0.4) {
                   targetX = ball.pos.x - 25;
                }

                if (!ballMovingToOwnGoal && ball.pos.y < GROUND_Y - 60) {
                    targetX = ball.pos.x + (ball.vel.x * lookAheadFrames) + (isRightTeam ? 30 : -30);
                }

                if (targetX > GAME_WIDTH - 25) targetX = GAME_WIDTH - 25;
                if (targetX < 0) targetX = 0;

                if (ballMovingToOwnGoal && isRightTeam && ball.pos.x > GAME_WIDTH * 0.4) {
                     deadzone = 5; 
                } else if (ballMovingToOwnGoal && !isRightTeam && ball.pos.x < GAME_WIDTH * 0.6) {
                     deadzone = 5;
                }

                let moveDir = 0;
                if (Math.abs(ai.pos.x - targetX) > deadzone) {
                    moveDir = ai.pos.x < targetX ? 1 : -1;
                }

                if (isRightTeam && !isBallLeftOfAI && ball.pos.x > ai.pos.x + 10) {
                    moveDir = 1; 
                } else if (!isRightTeam && isBallLeftOfAI && ball.pos.x < ai.pos.x - 10) {
                    moveDir = -1;
                }
                
                ai.vel.x += moveDir * ai.speed;

                if (ai.isGrounded) {
                    const dx = ai.pos.x - ball.pos.x;
                    const t = (ball.vel.x > 0.5) ? dx / ball.vel.x : 999;
                    let predY = ball.pos.y;
                    if (t > 0 && t < 40) predY = ball.pos.y + ball.vel.y * t + 0.5 * GRAVITY * t * t;

                    const jumpReach = ai.pos.y - 160; 

                    if (ball.vel.x > 4 && t > 0 && t < 30 * jumpSensitivity) {
                        if (predY < ai.pos.y - 20 && predY > jumpReach) {
                            if (Math.abs(dx) < 100 * jumpSensitivity) {
                                ai.vel.y = -ai.jumpForce;
                                ai.isGrounded = false;
                                onSound('JUMP');
                            }
                        }
                    } else if (ball.vel.x > 8 && ball.pos.y < GROUND_Y - 40 && dx > 0 && dx < 180) {
                        ai.vel.y = -ai.jumpForce;
                        ai.isGrounded = false;
                        onSound('JUMP');
                    } else if (Math.abs(dx) < 60 * jumpSensitivity && ball.pos.y < ai.pos.y - 60) {
                         if (ball.vel.y > -5) {
                            ai.vel.y = -ai.jumpForce;
                            ai.isGrounded = false;
                            onSound('JUMP');
                         }
                    } else if (distance(ai.pos, opponent.pos) < 90 && ball.pos.y < GROUND_Y - 50 && Math.abs(dx) < 70) {
                         ai.vel.y = -ai.jumpForce;
                         ai.isGrounded = false;
                         onSound('JUMP');
                    }
                }

                this.applyPhysics(ai);
                this.constrainPlayer(ai);
            }

            applyPhysics(e) {
                e.vel.y += GRAVITY;
                e.vel.x *= FRICTION;
                e.pos.x += e.vel.x;
                e.pos.y += e.vel.y;
            }

            updateBall(b, onSound) {
                b.vel.y += GRAVITY;
                b.vel.x *= AIR_RESISTANCE;

                const speed = Math.sqrt(b.vel.x * b.vel.x + b.vel.y * b.vel.y);
                if (speed > BALL_MAX_SPEED) {
                    const scale = BALL_MAX_SPEED / speed;
                    b.vel.x *= scale;
                    b.vel.y *= scale;
                }

                b.pos.x += b.vel.x;
                b.pos.y += b.vel.y;

                const goalTopY = GROUND_Y - GOAL_HEIGHT;
                if (b.pos.y - b.radius < -500) { 
                    b.pos.y = -500; 
                    b.vel.y = 0; 
                }

                if (b.pos.y + b.radius > GROUND_Y) {
                    const impact = Math.abs(b.vel.y);
                    b.pos.y = GROUND_Y - b.radius;
                    b.vel.y *= -b.restitution;
                    if (impact > 2) onSound('WALL');
                }

                const isAboveGoal = b.pos.y < goalTopY + b.radius; 
                if (isAboveGoal) {
                    if (b.pos.x - b.radius < 0) {
                        b.pos.x = b.radius;
                        b.vel.x *= -0.8;
                        onSound('WALL');
                    } else if (b.pos.x + b.radius > GAME_WIDTH) {
                        b.pos.x = GAME_WIDTH - b.radius;
                        b.vel.x *= -0.8;
                        onSound('WALL');
                    }
                } else {
                    if (b.pos.x < -100) { b.pos.x = -100; b.vel.x *= -0.5; }
                    if (b.pos.x > GAME_WIDTH + 100) { b.pos.x = GAME_WIDTH + 100; b.vel.x *= -0.5; }
                }

                const barRadius = 6; 
                const leftBarStart = { x: -50, y: goalTopY };
                const leftBarEnd = { x: GOAL_WIDTH, y: goalTopY };
                
                if (resolveStaticCapsuleCollision(b, leftBarStart, leftBarEnd, barRadius)) {
                    onSound('WALL');
                    if (b.pos.y < goalTopY) {
                        b.vel.y = Math.min(b.vel.y, -9); 
                        b.vel.x = Math.abs(b.vel.x) * 0.5 + 8;
                    }
                }

                const rightBarStart = { x: GAME_WIDTH - GOAL_WIDTH, y: goalTopY };
                const rightBarEnd = { x: GAME_WIDTH + 50, y: goalTopY };

                if (resolveStaticCapsuleCollision(b, rightBarStart, rightBarEnd, barRadius)) {
                    onSound('WALL');
                    if (b.pos.y < goalTopY) {
                        b.vel.y = Math.min(b.vel.y, -9);
                        b.vel.x = -(Math.abs(b.vel.x) * 0.5 + 8);
                    }
                }
            }

            constrainPlayer(p) {
                if (p.pos.y + p.radius > GROUND_Y) {
                    p.pos.y = GROUND_Y - p.radius;
                    p.vel.y = 0;
                    p.isGrounded = true;
                }
                if (p.pos.x - p.radius < 0) {
                    p.pos.x = p.radius;
                    p.vel.x = 0;
                }
                if (p.pos.x + p.radius > GAME_WIDTH) {
                    p.pos.x = GAME_WIDTH - p.radius;
                    p.vel.x = 0;
                }
            }

            checkGoal(onSound) {
                const goalTopY = GROUND_Y - GOAL_HEIGHT;
                if (this.state.ball.pos.y > goalTopY + this.state.ball.radius * 0.5) {
                    if (this.state.ball.pos.x < GOAL_WIDTH) {
                        this.handleGoal(2, onSound);
                    } else if (this.state.ball.pos.x > GAME_WIDTH - GOAL_WIDTH) {
                        this.handleGoal(1, onSound);
                    }
                }
            }

            handleGoal(scorerId, onSound) {
                this.state.isGoal = true;
                this.state.lastScorer = scorerId;
                if (scorerId === 1) {
                    this.state.score.p1++;
                    if (this.state.lastTouchedBy === 2 || this.state.lastTouchedBy === 4) onSound('EV_WRONG_SIDE');
                } else {
                    this.state.score.p2++;
                    if (this.state.lastTouchedBy === 1 || this.state.lastTouchedBy === 3) onSound('EV_WRONG_SIDE');
                }
                
                if (this.difficulty !== 'TRAINING' && (this.state.score.p1 >= WIN_SCORE || this.state.score.p2 >= WIN_SCORE)) {
                    onSound('WIN');
                } else {
                    onSound('GOAL');
                }
            }
        }

            useEffect(() => {

                        }
                    } else {
                        setStatus('PAUSED');
                    }
                };
                const onFocus = () => { minimizedByMeRef.current = false; };
                const onVisibility = () => { if (document.hidden) triggerPause(); else minimizedByMeRef.current = false; };
                const onBlur = () => triggerPause();

            const readGamepad = (index) => {
                let gp = null;
                try {
                    gp = navigator.getGamepads ? navigator.getGamepads()[index] : null;
                } catch (e) {
                }
                if (!gp) return { left: false, right: false, jump: false, start: false };
                const axisX = gp.axes[0] || 0;
                const left  = axisX < -0.4 || (gp.buttons[14] && gp.buttons[14].pressed);
                const right = axisX >  0.4 || (gp.buttons[15] && gp.buttons[15].pressed);
                const jump  = (gp.buttons[0] && gp.buttons[0].pressed)
                    || (gp.buttons[1] && gp.buttons[1].pressed)
                    || (gp.buttons[2] && gp.buttons[2].pressed)
                    || (gp.buttons[3] && gp.buttons[3].pressed);
                const start = (gp.buttons[9] && gp.buttons[9].pressed) || (gp.buttons[7] && gp.buttons[7].pressed);
                return { left, right, jump, start };
            };

                const p1Right = keys.has(InputKey.D) || (!is2P && keys.has(InputKey.RIGHT)) || (isOnline && keys.has(InputKey.RIGHT)) || gp0.right;
                const p1Jump  = keys.has(InputKey.W) || (!is2P && keys.has(InputKey.UP)) || (isOnline && keys.has(InputKey.UP)) || gp0.jump;
                const p2Left  = (is2P && keys.has(InputKey.LEFT)) || (is2P && gp1.left);

            const drawGradientCircle = (ctx, x, y, r, colorStart, colorEnd) => {
                const grad = ctx.createRadialGradient(x - r/3, y - r/3, r/10, x, y, r);
                grad.addColorStop(0, colorStart);
                grad.addColorStop(1, colorEnd);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "rgba(255,255,255,0.2)";
                ctx.beginPath();
                ctx.arc(x - r/3, y - r/3, r/4, 0, Math.PI * 2);
                ctx.fill();
            };

            const drawPlayerEyes = (ctx, x, y, r, velX) => {
                const lookDir = velX >= 0 ? 1 : -1;
                const eyeOffsetX = r * 0.4 * lookDir;
                const eyeOffsetY = -r * 0.2;
                const eyeSize = r * 0.25;

                ctx.fillStyle = "white";
                ctx.beginPath();
                ctx.arc(x + eyeOffsetX, y + eyeOffsetY, eyeSize, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "black";
                ctx.beginPath();
                ctx.arc(x + eyeOffsetX + (lookDir * 2), y + eyeOffsetY, eyeSize * 0.4, 0, Math.PI * 2);
                ctx.fill();
            };

            const drawNet = (ctx, x, y, w, h, isRight) => {
                ctx.save();
                ctx.strokeStyle = COLORS.net;
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                const backX = isRight ? x + w : x;
                const frontX = isRight ? x : x + w;

                ctx.strokeStyle = "white";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(frontX, y);
                ctx.lineTo(frontX, y + h); 
                ctx.moveTo(frontX, y); 
                ctx.lineTo(backX, y); 
                ctx.stroke();

                ctx.strokeStyle = COLORS.net;
                ctx.lineWidth = 1;
                ctx.beginPath();
                const step = 12;
                
                for(let i = y; i <= y + h; i += step) {
                ctx.moveTo(x, i);
                ctx.lineTo(x + w, i);
                }
                for(let i = x; i <= x + w; i += step) {
                ctx.moveTo(i, y);
                ctx.lineTo(i, y + h);
                }
                ctx.stroke();
                ctx.restore();
            };

            const draw = (ctx, engine) => {
                const bgGradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
                bgGradient.addColorStop(0, "#1a202c");
                bgGradient.addColorStop(1, "#2d3748");
                ctx.fillStyle = bgGradient;
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

                const numStripes = 10;
                const stripeWidth = GAME_WIDTH / numStripes;
                for (let i = 0; i < numStripes; i++) {
                    ctx.fillStyle = i % 2 === 0 ? COLORS.ground : COLORS.groundLight;
                    ctx.fillRect(i * stripeWidth, GROUND_Y, stripeWidth, GAME_HEIGHT - GROUND_Y);
                }

                ctx.shadowBlur = 10;
                ctx.shadowColor = "white";
                ctx.strokeStyle = COLORS.lines;
                ctx.lineWidth = 3;

                ctx.beginPath();
                ctx.moveTo(GAME_WIDTH / 2, GROUND_Y);
                ctx.lineTo(GAME_WIDTH / 2, GAME_HEIGHT);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(GAME_WIDTH / 2, GROUND_Y, 100, 0, Math.PI, false);

                drawNet(ctx, 0, GROUND_Y - GOAL_HEIGHT, GOAL_WIDTH, GOAL_HEIGHT, false);

                const { player1, player2, player3, player4, ball, is2v2 } = engine.state;

                ctx.fillStyle = "rgba(0,0,0,0.3)";
                const drawShadow = (x, y, r) => {
                    const height = Math.max(0, GROUND_Y - (y + r)); 
                    const scale = Math.max(0.5, 1 - height / 300);
                    ctx.beginPath();
                    ctx.ellipse(x, GROUND_Y, r * scale, r * 0.3 * scale, 0, 0, Math.PI * 2);
                    ctx.fill();
                };
                drawShadow(player1.pos.x, player1.pos.y, player1.radius);

                drawShadow(ball.pos.x, ball.pos.y, ball.radius);

                drawGradientCircle(ctx, player1.pos.x, player1.pos.y, player1.radius, COLORS.p1, COLORS.p1Dark);
                drawPlayerEyes(ctx, player1.pos.x, player1.pos.y, player1.radius, player1.vel.x);
                
                if (engine.difficulty !== 'TRAINING') {
                    const p2Color = engine.state.p2IsTeammate ? COLORS.p1 : COLORS.p2;
                    const p2DarkColor = engine.state.p2IsTeammate ? COLORS.p1Dark : COLORS.p2Dark;
                    drawGradientCircle(ctx, player2.pos.x, player2.pos.y, player2.radius, p2Color, p2DarkColor);
                    drawPlayerEyes(ctx, player2.pos.x, player2.pos.y, player2.radius, player2.vel.x);

                    if (is2v2) {
                        const p3DarkColor = engine.state.p2IsTeammate ? COLORS.p2Dark : '#2563eb';
                        drawGradientCircle(ctx, player3.pos.x, player3.pos.y, player3.radius, player3.color, p3DarkColor);
                        drawPlayerEyes(ctx, player3.pos.x, player3.pos.y, player3.radius, player3.vel.x);
                        
                        const p4DarkColor = engine.state.p2IsTeammate ? COLORS.p2Dark : '#dc2626';
                        drawGradientCircle(ctx, player4.pos.x, player4.pos.y, player4.radius, player4.color, p4DarkColor);
                        drawPlayerEyes(ctx, player4.pos.x, player4.pos.y, player4.radius, player4.vel.x);
                    }
                }

                drawGradientCircle(ctx, ball.pos.x, ball.pos.y, ball.radius, COLORS.ball, COLORS.ballDark);
                ctx.strokeStyle = "#cbd5e0";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(ball.pos.x, ball.pos.y, ball.radius * 0.6, 0, Math.PI * 2);
                ctx.stroke();
                
                const p1Name = isOnlineRef.current ? (isHostRef.current ? playerName : (opponentName || "P1")) : (playerName || "P1");
                const p2Name = isOnlineRef.current ? (isHostRef.current ? (opponentName || "P2") : playerName) : (isTwoPlayer ? (player2Name || "P2") : botRival1Name);

                ctx.fillStyle = "white";
                ctx.font = "bold 14px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(p1Name.toUpperCase(), player1.pos.x, player1.pos.y - player1.radius - 15);
                if (engine.difficulty !== 'TRAINING') {
                    ctx.fillText(p2Name.toUpperCase(), player2.pos.x, player2.pos.y - player2.radius - 15);
                    if (is2v2) {
                        let p3Name = "CPU";
                        let p4Name = "CPU";
                        if (isOnlineRef.current) {
                            p3Name = "P3";
                            p4Name = "P4";
                        } else {
                            if (engine.state.p2IsTeammate) {
                                p3Name = botRival1Name;
                                p4Name = botRival2Name;
                            } else {
                                p3Name = botTeammateName;
                                p4Name = botRival2Name;
                            }
                        }
                        ctx.fillText(p3Name.toUpperCase(), player3.pos.x, player3.pos.y - player3.radius - 15);
                        ctx.fillText(p4Name.toUpperCase(), player4.pos.x, player4.pos.y - player4.radius - 15);
                    }
                }
            };

            const gameLoop = useCallback((time) => {
                let frameTime = (time - lastTimeRef.current) / 1000;
                lastTimeRef.current = time;
                if (frameTime > MAX_FRAME_TIME) frameTime = MAX_FRAME_TIME;

                const engine = engineRef.current;
                const canvas = canvasRef.current;
                const ctx = canvas?.getContext('2d');

                if (status === 'PLAYING') {
                    accumulatorRef.current += frameTime;
                    while (accumulatorRef.current >= FIXED_TIME_STEP) {
                        if (!winner) {
                            if (!isOnlineRef.current || isHostRef.current) {
                                const inputs = getInputState(isTwoPlayer);
                                if (isOnlineRef.current && isHostRef.current) {
                                    inputs.p2 = clientInputsRef.current[0];
                                    if (engine.state.is2v2) {
                                        inputs.p3 = clientInputsRef.current[1];
                                        inputs.p4 = clientInputsRef.current[2];
                                    }
                                }

                                engine.update(inputs, isTwoPlayer, (type) => {
                                    if (type.startsWith('EV_')) {
                                        const eventName = type.substring(3).toLowerCase();
                                        if (eventName === 'wrong_side' || eventName === 'acrobat' || eventName === 'peacemaker') {
                                            unlockAchievement(eventName);
                                        }
                                        return;
                                    }
                                    audioService.play(type);
                                    if (isOnlineRef.current && isHostRef.current) {
                                        broadcastToClients({ type: 'SOUND', sound: type });
                                    }
                                });
                                
                                if (engine.state.isGoal && !engine.state.winner) {
                                    if (score.p1 !== engine.state.score.p1 || score.p2 !== engine.state.score.p2) {
                                        setScore({ ...engine.state.score });
                                        if (score.p1 !== engine.state.score.p1) {
                                            updateStat('goals', 1);
                                            unlockAchievement('net_breaker');
                                            if (engine.state.timeLeft <= 5 && engine.state.timeLeft > 0) unlockAchievement('buzzer_beater');
                                        }
                                    }

                                    let isGameOver = false;
                                    if (engine.difficulty !== 'TRAINING') {
                                        if (engine.state.score.p1 >= WIN_SCORE) {
                                            setWinner('Player 1 Wins!');
                                            setStatus('ENDED');
                                            audioService.play('WIN');
                                            updateStat('gamesPlayed', 1);
                                            updateStat('wins', 1);
                                            unlockAchievement('first_whistle');
                                            if (engine.state.score.p2 === 0) unlockAchievement('steel_wall');
                                            if (!isTwoPlayer && !engine.state.is2v2 && selectedDifficulty === 'INSANE') unlockAchievement('david_goliath');
                                            if (engine.state.is2v2) unlockAchievement('team_player');
                                            if (isOnlineRef.current) unlockAchievement('global_connection');
                                            if (isTwoPlayer && !isOnlineRef.current && !engine.state.is2v2) unlockAchievement('couch_king');
                                            if (score.p1 >= 10 && engine.state.timeLeft > 0) unlockAchievement('monumental_beating');
                                            isGameOver = true;
                                        } else if (engine.state.score.p2 >= WIN_SCORE) {
                                            setWinner(isTwoPlayer ? 'Player 2 Wins!' : 'Computer Wins!');
                                            setStatus('ENDED');
                                            audioService.play('WIN');
                                            updateStat('gamesPlayed', 1);
                                            unlockAchievement('first_whistle');
                                            if (engine.state.is2v2) unlockAchievement('team_player');
                                            if (isOnlineRef.current) unlockAchievement('global_connection');
                                            isGameOver = true;
                                        }
                                    }
                                    
                                    if (!isGameOver) {
                                        if (!engineRef.current['resetPending']) {
                                            engineRef.current['resetPending'] = true;
                                            engineRef.current['resetFrames'] = 120;
                                        } else {
                                            if (engineRef.current['resetFrames'] > 0) {
                                                engineRef.current['resetFrames']--;
                                            } else {
                                                engine.resetPositions();
                                                engineRef.current['resetPending'] = false;
                                                setScore({...engine.state.score});
                                                if (isOnlineRef.current && isHostRef.current) {
                                                    broadcastToClients({ type: 'KICKOFF' });
                                                }
                                            }
                                        }
                                    }
                                }

                                if (engine.difficulty !== 'TRAINING' && engine.state.timeLeft <= 0 && !engine.state.isGoal) {
                                    if (engine.state.score.p1 > engine.state.score.p2) {
                                        setWinner('Player 1 Wins!');
                                        updateStat('gamesPlayed', 1);
                                        updateStat('wins', 1);
                                        unlockAchievement('first_whistle');
                                        if (engine.state.score.p2 === 0) unlockAchievement('steel_wall');
                                        if (!isTwoPlayer && !engine.state.is2v2 && selectedDifficulty === 'INSANE') unlockAchievement('david_goliath');
                                        if (engine.state.is2v2) unlockAchievement('team_player');
                                        if (isOnlineRef.current) unlockAchievement('global_connection');
                                        if (isTwoPlayer && !isOnlineRef.current && !engine.state.is2v2) unlockAchievement('couch_king');
                                        if (score.p1 >= 10 && engine.state.timeLeft > 0) unlockAchievement('monumental_beating');
                                    } else if (engine.state.score.p2 > engine.state.score.p1) {
                                        setWinner(isTwoPlayer ? 'Player 2 Wins!' : 'Computer Wins!');
                                        updateStat('gamesPlayed', 1);
                                        unlockAchievement('first_whistle');
                                        if (engine.state.is2v2) unlockAchievement('team_player');
                                        if (isOnlineRef.current) unlockAchievement('global_connection');
                                    } else {
                                        setWinner('Draw!');
                                        updateStat('gamesPlayed', 1);
                                        unlockAchievement('first_whistle');
                                        unlockAchievement('balanced_forces');
                                        if (engine.state.is2v2) unlockAchievement('team_player');
                                        if (isOnlineRef.current) unlockAchievement('global_connection');
                                    }
                                    setStatus('ENDED');
                                    audioService.play('WIN');
                                }
                            } else {
                                
                                const clientInput = getClientInputState();
                                if (connRef.current && connRef.current.open) {
                                    connRef.current.send({ type: 'INPUT', input: clientInput });
                                }
                            }
                        }
                        accumulatorRef.current -= FIXED_TIME_STEP;
                    }
                }

                if (ctx) draw(ctx, engine);

                if (!isOnlineRef.current || isHostRef.current) {
                    const engineTime = Math.ceil(engine.state.timeLeft);
                    setTimeLeft(prev => prev !== engineTime ? engineTime : prev);

                    if (isOnlineRef.current && isHostRef.current) {
                        netTickRef.current++;
                        if (netTickRef.current % 2 === 0) {
                            broadcastToClients({
                                type: 'STATE',
                                state: engine.state,
                                score: latestScore.current,
                                status: latestStatus.current,
                                winner: latestWinner.current,
                                hostName: playerName || ''
                            });
                        }
                    }
                }

                requestRef.current = requestAnimationFrame(gameLoop);
            }, [status, isTwoPlayer, winner, score]);

            useEffect(() => {
                requestRef.current = requestAnimationFrame(gameLoop);
                return () => {
                    if (requestRef.current) cancelAnimationFrame(requestRef.current);
                };
            }, [gameLoop]);

            const playUiSound = () => {
                audioService.init();
                audioService.play('UI_SELECT');
            };

            const handleVolumeChange = (e) => {
                const val = parseInt(e.target.value);
                setVolume(val);
                audioService.setVolume(val / 100);
                if (Math.random() > 0.8) audioService.play('UI_SELECT'); 
            };

            const startGame = (mode2P, difficulty = 'MEDIUM', online = false, is2v2Flag = false, isP2Teammate = false) => {
                playUiSound();
                setIsTwoPlayer(mode2P);
                setSelectedDifficulty(difficulty);
                isOnlineRef.current = online;
                
                engineRef.current = new GameEngine();
                engineRef.current.setDifficulty(difficulty);
                engineRef.current.state.is2v2 = is2v2Flag;
                engineRef.current.state.p2IsTeammate = isP2Teammate;
                if (isP2Teammate) {
                    engineRef.current.state.player2.color = '#3182ce'; // Team 1 color
                    engineRef.current.state.player3.color = '#e53e3e'; // Team 2 color
                }
                engineRef.current.resetPositions();
                
                setScore({ p1: 0, p2: 0 });
                setTimeLeft(GAME_DURATION);
                setWinner(null);
                setRematchRequested(false);
                setOpponentRematchRequested(false);
                setMenuState('MAIN');
                setPausesLeft(3);
                
                setCountdown(3);
                setStatus('COUNTDOWN');
            };

            const setupConnection = (conn, isHost) => {
                let opponentLeaving = false;

                const initConn = () => {
                    isHostRef.current = isHost;
                    isOnlineRef.current = true;
                    unlockAchievement('first_online');
                    conn.send({ type: 'SET_NAME', name: playerName.trim() || 'Player' });
                    
                    if (isHost) {
                        connectionsRef.current.push(conn);
                        const requiredPlayers = gameFormat ? 3 : 1;
                        if (connectionsRef.current.length < requiredPlayers) {
                            const players = connectionsRef.current.length + 1;
                            const total = requiredPlayers + 1;
                            setConnectionStatus(t('waitingMorePlayers').replace('{var}', requiredPlayers - connectionsRef.current.length).replace('{var2}', `${players}/${total}`));
                            broadcastToClients({ type: 'LOBBY_UPDATE', players, total });
                        } else {
                            setTimeout(() => {
                                broadcastToClients({ type: 'START', hostName: playerName.trim() || 'Player', is2v2: gameFormat });
                                startGame(true, 'MEDIUM', true, gameFormat);
                            }, 500);
                        }
                    } else {
                        setConnectionStatus(t('connectedWaitingHost'));
                    }
                };

                if (conn.open) {
                    initConn();
                } else {
                    conn.on('open', initConn);
                }

                conn.on('data', (data) => {
                    if (data.type === 'REJECTED') {
                        if (latestMenuState.current === 'QUICK_PLAYING') {
                            if (quickPlayPeerRef.current) quickPlayPeerRef.current.destroy();
                            searchSlot(quickPlaySlotRef.current + 1);
                        } else {
                            setConnectionError('Host is busy.');
                            cancelJoin();
                        }
                        return;
                    }
                    if (data.type === 'SET_NAME') {
                        setOpponentName(data.name);
                        return;
                    }
                    if (data.type === 'LEAVING') {
                        opponentLeaving = true;
                        setConnectionError('opponent left');
                        setTimeout(() => {
                            setConnectionError('');
                            setStatus('MENU');
                            setMenuState('MAIN');
                            setWinner(null);
                            setCountdown(null);
                            isOnlineRef.current = false;
                            isHostRef.current = false;
                            if (peerRef.current) { peerRef.current.destroy(); peerRef.current = null; }
                        }, 3000);
                        return;
                    }
                    if (data.type === 'REMATCH_REQUEST') {
                        setOpponentRematchRequested(true);
                        if (isHost && rematchRequestedRef.current && latestStatus.current !== 'PLAYING' && latestStatus.current !== 'COUNTDOWN') {
                            broadcastToClients({ type: 'START', hostName: playerName.trim() || 'Player', is2v2: gameFormat });
                            startGame(true, 'MEDIUM', true, gameFormat);
                        }
                        return;
                    }
                    if (isHost) {
                        if (data.type === 'INPUT') {
                            const playerIndex = connectionsRef.current.indexOf(conn);
                            if (playerIndex >= 0) {
                                clientInputsRef.current[playerIndex] = data.input;
                            }
                        } else if (data.type === 'PAUSE_REQUEST') {
                            if (latestStatus.current === 'PLAYING') {
                                pausedByMeRef.current = false;
                                setStatus('PAUSED');
                                broadcastToClients({ type: 'PAUSE', initiator: 'CLIENT' });
                            }
                        } else if (data.type === 'RESUME_REQUEST') {
                            if (latestStatus.current === 'PAUSED') {
                                setCountdown(3);
                                setStatus('COUNTDOWN');
                                broadcastToClients({ type: 'RESUME' });
                            }
                        } else if (data.type === 'FORFEIT') {
                            setConnectionError('Your opponent forfeited the match.');
                            setTimeout(() => {
                                setConnectionError('');
                                setStatus('MENU');
                                setMenuState('MAIN');
                                setWinner(null);
                                setCountdown(null);
                                isOnlineRef.current = false;
                                isHostRef.current = false;
                                if (peerRef.current) { peerRef.current.destroy(); peerRef.current = null; }
                            }, 3000);
                        }
                    } else {
                        if (data.type === 'PAUSE') {
                            pausedByMeRef.current = (data.initiator === 'CLIENT');
                            setStatus('PAUSED');
                        } else if (data.type === 'RESUME') {
                            setCountdown(3);
                            setStatus('COUNTDOWN');
                        } else if (data.type === 'KICKOFF') {
                            engineRef.current.state.isGoal = false;
                            engineRef.current.state.kickoffFrames = 60;
                        } else if (data.type === 'LOBBY_UPDATE') {
                            setConnectionStatus(t('connectedWaitingHost') + `\n(${data.players}/${data.total})`);
                        } else if (data.type === 'START') {
                            if (data.hostName) setOpponentName(data.hostName);
                            setGameFormat(!!data.is2v2);
                            startGame(true, 'MEDIUM', true, !!data.is2v2);
                        } else if (data.type === 'STATE') {
                            if (data.hostName && !opponentName) setOpponentName(data.hostName);
                            const wasGoal = engineRef.current.state.isGoal;
                            engineRef.current.state = data.state;
                            if (!wasGoal && data.state.isGoal) {
                                setTimeout(() => {
                                    if (engineRef.current.state.isGoal) {
                                        engineRef.current.state.isGoal = false;
                                    }
                                }, 1000);
                            }
                            if (latestScore.current.p1 !== data.score.p1 || latestScore.current.p2 !== data.score.p2) {
                                setScore(data.score);
                                if (!isHostRef.current) {
                                    if (latestScore.current.p2 !== data.score.p2) updateStat('goals', 1);
                                    if (data.score.p2 === 5) unlockAchievement('five_goals');
                                }
                            }
                            if (latestStatus.current !== data.status) {
                                if (!(latestStatus.current === 'PAUSED' && data.status === 'PLAYING')) {
                                    setStatus(data.status);
                                    if (data.status === 'COUNTDOWN') {
                                        setCountdown(3);
                                    }
                                }
                            }
                            if (latestWinner.current !== data.winner) {
                                setWinner(data.winner);
                                if (!isHostRef.current && data.winner) {
                                    updateStat('gamesPlayed', 1);
                                    if (data.winner === 'Player 2 Wins!') updateStat('wins', 1);
                                }
                            }
                            setTimeLeft(Math.ceil(data.state.timeLeft));
                        } else if (data.type === 'SOUND') {
                            audioService.play(data.sound);
                        }
                    }
                });

                conn.on('close', () => {
                    if (opponentLeaving) return;
                    const wasPlaying = latestStatus.current === 'PLAYING' || latestStatus.current === 'PAUSED' || latestStatus.current === 'COUNTDOWN';
                    if (wasPlaying) {
                        setConnectionError('opponent left');
                        setTimeout(() => {
                            setConnectionError('');
                            setStatus('MENU');
                            setMenuState('MAIN');
                            setWinner(null);
                            setCountdown(null);
                            isOnlineRef.current = false;
                            isHostRef.current = false;
                            if (peerRef.current) { peerRef.current.destroy(); peerRef.current = null; }
                        }, 3000);
                    } else {
                        setConnectionError('Connection lost');
                        setTimeout(() => {
                            setConnectionError('');
                            setStatus('MENU');
                            setMenuState('MAIN');
                            setWinner(null);
                            setCountdown(null);
                            isOnlineRef.current = false;
                            isHostRef.current = false;
                        }, 3000);
                    }
                });

                conn.on('error', (err) => {
                    setConnectionError('Connection error: ' + err.type);
                    setTimeout(() => {
                        quitToMenu();
                        setConnectionError('');
                    }, 2000);
                });
            };

            const peerConfig = {
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:stun3.l.google.com:19302' },
                        { urls: 'stun:stun4.l.google.com:19302' }
                    ]
                }
            };

            const hostOnlineGame = () => {
                playUiSound();
                connectionsRef.current = [];
                if (!playerName.trim()) setPlayerName('Player');
                setMenuState('HOSTING');
                setConnectionStatus(t('creatingPeer'));
                const peer = new Peer(peerConfig);
                peerRef.current = peer;
                
                peer.on('open', (id) => {
                    setPeerId(id);
                    const total = gameFormat ? 4 : 2;
                    setConnectionStatus(t('waitingOpponent') + `\n(1/${total})`);
                });

                peer.on('connection', (conn) => {
                    if (latestStatus.current !== 'MENU' || latestMenuState.current !== 'HOSTING') {
                        const reject = () => {
                            conn.send({ type: 'REJECTED' });
                            setTimeout(() => conn.close(), 500);
                        };
                        if (conn.open) reject();
                        else conn.on('open', reject);
                        return;
                    }
                    setConnectionStatus(t('opponentConnected'));
                    connRef.current = conn;
                    setupConnection(conn, true);
                });

                peer.on('error', (err) => {
                    setConnectionError('Error: ' + (err.type || err.message || 'Unknown error'));
                });
            };

            const joinOnlineGame = () => {
                playUiSound();
                if (!playerName.trim()) setPlayerName('Player');
                if (!joinId) return;
                setConnectionStatus(t('connecting'));
                const peer = new Peer(peerConfig);
                peerRef.current = peer;
                
                peer.on('open', () => {
                    const conn = peer.connect(joinId);
                    connRef.current = conn;
                    setupConnection(conn, false);
                });

                peer.on('error', (err) => {
                    setConnectionError('Error: ' + (err.type || err.message || 'Unknown error'));
                });
            };

            const cancelHost = () => {
                playUiSound();
                if (peerRef.current) {
                    peerRef.current.destroy();
                    peerRef.current = null;
                }
                setMenuState('ONLINE_MENU');
                setConnectionStatus('');
            };

            const cancelJoin = () => {
                playUiSound();
                if (peerRef.current) {
                    peerRef.current.destroy();
                    peerRef.current = null;
                }
                setMenuState('ONLINE_MENU');
                setConnectionStatus('');
            };

            const quickPlay = () => {
                playUiSound();
                connectionsRef.current = [];
                if (!playerName.trim()) setPlayerName('Player');
                setMenuState('QUICK_PLAYING');
                setConnectionStatus(t('searching'));
                quickPlaySlotRef.current = 1;
                searchSlot(1);
            };

            const searchSlot = (slot) => {
                quickPlaySlotRef.current = slot;
                if (slot > 20) {
                    setConnectionError('No matches found. Try again later.');
                    setMenuState('ONLINE_MENU');
                    return;
                }
                setConnectionStatus(t('searching') + ` (Slot ${slot})`);
                const peer = new Peer(peerConfig);
                quickPlayPeerRef.current = peer;
                peerRef.current = peer;
                isHostRef.current = false;

                peer.on('open', () => {
                    const conn = peer.connect(`kick-it-quick-${gameFormat ? '2v2' : '1v1'}-${slot}`);
                    
                    conn.on('open', () => {
                        connRef.current = conn;
                        setupConnection(conn, false);
                    });

                    conn.on('error', () => {
                        peer.destroy();
                        searchSlot(slot + 1);
                    });
                });

                peer.on('error', (err) => {
                    if (err.type === 'peer-unavailable') {
                        peer.destroy();
                        hostSlot(slot);
                    } else if (err.type === 'network' || err.type === 'server-error' || err.type === 'browser-incompatible') {
                        peer.destroy();
                        setConnectionError('Error: ' + (err.type || err.message || 'Unknown error'));
                        cancelQuickPlay();
                    } else {
                        peer.destroy();
                        searchSlot(slot + 1);
                    }
                });
            };

            const hostSlot = (slot) => {
                const total = gameFormat ? 4 : 2;
                setConnectionStatus(t('waitingOpponent') + `\n(1/${total})`);
                const peer = new Peer(`kick-it-quick-${gameFormat ? '2v2' : '1v1'}-${slot}`, peerConfig);
                quickPlayPeerRef.current = peer;
                peerRef.current = peer;
                isHostRef.current = true;

                peer.on('open', () => {
                    
                });

                peer.on('connection', (conn) => {
                    if (latestStatus.current !== 'MENU' || latestMenuState.current !== 'QUICK_PLAYING') {
                        const reject = () => {
                            conn.send({ type: 'REJECTED' });
                            setTimeout(() => conn.close(), 500);
                        };
                        if (conn.open) reject();
                        else conn.on('open', reject);
                        return;
                    }
                    
                    setConnectionStatus(t('opponentFound'));
                    connRef.current = conn;
                    setupConnection(conn, true);
                });

                peer.on('error', (err) => {
                    if (err.type === 'unavailable-id') {
                        peer.destroy();
                        searchSlot(slot + 1);
                    } else {
                        setConnectionError('Error: ' + (err.type || err.message || 'Unknown error'));
                        cancelQuickPlay();
                    }
                });
            };

            const cancelQuickPlay = () => {
                playUiSound();
                if (quickPlayPeerRef.current) {
                    quickPlayPeerRef.current.destroy();
                    quickPlayPeerRef.current = null;
                }
                if (peerRef.current) {
                    peerRef.current.destroy();
                    peerRef.current = null;
                }
                setMenuState('ONLINE_MENU');
                setConnectionStatus('');
            };

            const handleRematchClick = () => {
                playUiSound();
                if (!isOnlineRef.current) {
                    restartGame();
                    return;
                }
                unlockAchievement('thirst_revenge');
                setRematchRequested(true);
                if (!isHostRef.current) {
                    if (connRef.current && connRef.current.open) {
                        connRef.current.send({ type: 'REMATCH_REQUEST' });
                    }
                } else {
                    broadcastToClients({ type: 'REMATCH_REQUEST' });
                }
                if (isHostRef.current && opponentRematchRequested) {
                    broadcastToClients({ type: 'START', hostName: playerName.trim() || 'Player', is2v2: gameFormat });
                    startGame(isTwoPlayer, selectedDifficulty, true, gameFormat);
                }
            };

            const restartGame = () => {
                if (isOnlineRef.current && isHostRef.current) {
                    broadcastToClients({ type: 'START', hostName: playerName.trim() || 'Player', is2v2: gameFormat });
                }
                startGame(isTwoPlayer, selectedDifficulty, isOnlineRef.current, gameFormat);
            };
            
            const resumeGame = () => {
                playUiSound();
                pausedByMeRef.current = false;
                if (isOnlineRef.current) {
                    if (isHostRef.current) {
                        setCountdown(3);
                        setStatus('COUNTDOWN');
                        broadcastToClients({ type: 'RESUME' });
                    } else {
                        if (connRef.current && connRef.current.open) {
                            connRef.current.send({ type: 'RESUME_REQUEST' });
                        }
                    }
                } else {
                    setCountdown(3);
                    setStatus('COUNTDOWN');
                }
            };

            const quitToMenu = () => {
                playUiSound();
                setIsExiting(true);
                if (!isHostRef.current) {
                    if (connRef.current && connRef.current.open) {
                        try { connRef.current.send({ type: 'LEAVING' }); } catch(e) {}
                    }
                } else {
                    broadcastToClients({ type: 'LEAVING' });
                }
                if (peerRef.current) {
                    peerRef.current.destroy();
                    peerRef.current = null;
                }
                if (quickPlayPeerRef.current) {
                    quickPlayPeerRef.current.destroy();
                    quickPlayPeerRef.current = null;
                }
                isOnlineRef.current = false;
                isHostRef.current = false;
                setTimeout(() => {
                    setStatus('MENU');
                    setMenuState('MAIN');
                    setWinner(null);
                    setIsExiting(false);
                    setCountdown(null);
                }, 300);
            };

            const formatTime = (seconds) => seconds.toString();

            return (
                <div className="fixed inset-0 bg-slate-900 flex items-center justify-center overflow-hidden font-sans select-none w-full h-full">
                
                {status !== 'MENU' && status !== 'INTRO' && (
                    <div className="absolute top-0 left-0 w-full z-10 flex justify-between items-start px-8 py-6 bg-gradient-to-b from-black/60 to-transparent pointer-events-none">
                    
                    {selectedDifficulty !== 'TRAINING' && (
                        <div className="flex items-center gap-6">
                            <div className="text-slate-300 font-bold tracking-widest text-sm hidden sm:block">{t('score')}</div>
                            <div className="flex gap-4 text-white font-black text-4xl drop-shadow-lg tracking-wider items-center">
                                <div className="flex flex-col items-center">
                                    <span className="text-xs text-blue-300 uppercase tracking-widest mb-1">{isOnlineRef.current ? (isHostRef.current ? playerName : (opponentName || "Player 1")) : (playerName || "P1")}</span>

                            <button onClick={() => setShowBotNamesMenu(false)} className="bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 px-12 rounded-xl shadow-xl transform hover:scale-105 transition border-b-4 border-slate-900 text-sm sm:text-lg uppercase tracking-widest w-full mt-2">{t('botClose')}</button>
                        </div>
                    </div>
                )}

                {connectionError && (
                    <div className="absolute inset-0 bg-slate-900/95 flex flex-col items-center justify-center z-[200] animate-in fade-in duration-300">
                        <h2 className="text-4xl sm:text-5xl font-black text-red-500 mb-6 tracking-tighter italic uppercase" style={{textShadow: "4px 4px 0px #742a2a"}}>
                            {connectionError === 'opponent left' ? t('opponentLeftTitle') : t('errorTitle')}
                        </h2>
                        <p className="text-white font-black text-xl uppercase tracking-widest mb-12">
                            {connectionError === 'opponent left' ? t('opponentLeftMsg') : connectionError}
                        </p>
                        {connectionError !== 'opponent left' && (
                            <button onClick={() => setConnectionError('')} className="bg-slate-600 hover:bg-slate-500 text-white font-bold py-4 px-8 rounded-xl shadow-xl transform hover:scale-105 transition border-b-4 border-slate-800 text-lg uppercase tracking-wider">{t('dismiss')}</button>
                        )}
                        {connectionError === 'opponent left' && (
                            <p className="text-slate-400 font-bold text-sm uppercase tracking-widest animate-pulse">{t('opponentLeftMsg')}</p>
                        )}
                    </div>
                )}
                </div>
            );
        };

        const App = () => {
            return (
                <div className="w-full h-full">
                    <GameCanvas />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
